services:
  n8n:
    image: docker.n8n.io/n8nio/n8n
    container_name: n8n
    ports:
      - "5678:5678"
    volumes:
      - n8n_data:/home/node/.n8n
    restart: unless-stopped
    environment:
      - N8N_HOST=0.0.0.0
      - N8N_PORT=5678
      - N8N_PROTOCOL=https
      - NODE_ENV=production
      - WEBHOOK_URL=https://special-yodel-v6p6vgxvr472wp-5678.app.github.dev/
      
      # FIX: The "trust proxy" error
      - N8N_EXPRESS_TRUST_PROXY=true
      
      # FIX: The "Origin header does NOT match" error
      - N8N_SKIP_ORIGIN_CHECK=true
      - N8N_CORS_ALLOWED_ORIGINS=*
      
      # FIX: Force n8n to ignore the rate-limit validation crash
      - N8N_DISABLE_SETTINGS_VALIDATION=true
      
      # STABILITY: Use SSE (Server-Sent Events) for the UI connection
      - N8N_PUSH_BACKEND=sse

volumes:
  n8n_data: